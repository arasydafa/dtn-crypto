# test.yml — GitHub Actions workflow for running tests with coverage.
# Purpose: Runs pytest with coverage report and uploads to Codecov.
# Dependencies: pytest, pytest-cov, cryptography
# Usage: Triggered automatically by GitHub Actions on push and pull_request.

name: Test

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.11", "3.12", "3.13"]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install package with dev dependencies
              run: pip install -e ".[dev]"

            - name: Run tests with coverage
              run: pytest --cov=dtn_crypto --cov-report=xml --cov-report=term-missing

            - name: Upload coverage to Codecov
              if: matrix.python-version == '3.11'
              uses: codecov/codecov-action@v4
              with:
                  file: ./coverage.xml
                  fail_ci_if_error: false
              env:
                  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
