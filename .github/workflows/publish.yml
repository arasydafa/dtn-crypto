# publish.yml — GitHub Actions workflow for publishing to PyPI.
# Purpose: Builds and publishes the package to PyPI when a version tag is pushed.
# Dependencies: build, twine
# Usage: Triggered on push of tags matching v*.*.* (e.g., v0.1.0).

name: Publish to PyPI

on:
    push:
        tags:
            - "v*.*.*"

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
            id-token: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install build tools
              run: pip install build

            - name: Build package
              run: python -m build

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
