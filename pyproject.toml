# pyproject.toml — Build configuration for dtn-crypto package.
# Purpose: Defines package metadata, dependencies, and build system for PyPI.
# Dependencies: setuptools, wheel
# Usage: pip install . OR pip install -e ".[dev]"

[build-system]
requires = ["setuptools>=68.0", "wheel>=0.41.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dtn-crypto"
version = "0.1.0"
description = "Hybrid RSA-AES + CP-ABE encryption library for Delay-Tolerant Networks"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "DTN Crypto Contributors"},
]
keywords = ["dtn", "cryptography", "rsa", "aes", "cp-abe", "delay-tolerant-network", "bundle-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
simulator = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "httpx>=0.25.0",
]
all = [
    "dtn-crypto[simulator,dev]",
]

[project.urls]
Homepage = "https://github.com/dtn-crypto/dtn-crypto"
Documentation = "https://github.com/dtn-crypto/dtn-crypto#readme"
Repository = "https://github.com/dtn-crypto/dtn-crypto"
Issues = "https://github.com/dtn-crypto/dtn-crypto/issues"

[tool.setuptools.packages.find]
include = ["dtn_crypto*", "simulator*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["dtn_crypto", "simulator", "api"]

[tool.coverage.run]
source = ["dtn_crypto"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80
