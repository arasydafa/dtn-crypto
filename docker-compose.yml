# ============================================================
# DTN Crypto Simulator — Docker Compose
# ============================================================
# Usage:
#   Production:  docker compose up app
#   Development: docker compose --profile dev up app-dev
# ============================================================

services:
  # ---- Production ----
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
    restart: unless-stopped
    profiles: ["production"]

  # ---- Development (hot-reload) ----
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=http://localhost:5173
    volumes:
      - ./api:/app/api
      - ./simulator:/app/simulator
      - ./dtn_crypto:/app/dtn_crypto
      - ./frontend/dist:/app/frontend/dist
    command: ["uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
    profiles: ["dev"]
